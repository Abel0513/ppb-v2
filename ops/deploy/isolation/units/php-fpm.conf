; V2-only self-contained pool; do not include or edit legacy FPM pools.
[global]
pid = /www/wwwroot/ppbaos.com/storage/run/php-fpm.pid
error_log = /www/wwwroot/ppbaos.com/storage/logs/php-fpm.log
daemonize = no
[ppb-v2]
user = ppb-v2
group = ppb-v2
listen = /www/wwwroot/ppbaos.com/storage/run/php-fpm.sock
listen.mode = 0660
; Grant only the existing nginx worker access to this NEW socket; no old group changes.
listen.acl_users = www
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
clear_env = yes
security.limit_extensions = .php
catch_workers_output = yes
chdir = /www/wwwroot/ppbaos.com
php_admin_flag[allow_url_include] = off
php_admin_value[open_basedir] = /www/wwwroot/ppbaos.com:/tmp:/etc/ssl/certs:/usr/share/zoneinfo
