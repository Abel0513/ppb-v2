name: WP parameterized operations candidate
on:
  push:
    branches: ['codex/issue-12-wp-draft']
    paths: ['ops/wp-test/parameterized/**', 'ops/wp-test/tests/**', '.github/workflows/ppb-wp-parameterized.yml', 'ops/wp-test/audit-v2-capabilities.py']
  pull_request:
    paths: ['ops/wp-test/parameterized/**', 'ops/wp-test/tests/**', '.github/workflows/ppb-wp-parameterized.yml', 'ops/wp-test/audit-v2-capabilities.py']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [read, update_acf, verify]
        default: read
        required: true
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', coverage: none}
      - run: python3 -m unittest discover -s ops/wp-test/tests -v
      - run: php -l ops/wp-test/parameterized/worker.php
      - run: python3 ops/wp-test/parameterized/render.py --check
      - run: python3 ops/wp-test/interface/render.py --check
  authorized-read:
    needs: offline
    if: github.event_name != 'pull_request' && github.repository_id == '1454285732' && github.repository_owner_id == '55256582' && github.ref == 'refs/heads/codex/issue-12-wp-draft'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency: {group: ppb-issue-12-single-expert, cancel-in-progress: false}
    permissions: {contents: read, actions: read, id-token: write}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::429724121147:role/PPB-V2-GitHub-WP-Draft-Test-Role
          aws-region: us-east-1
          allowed-account-ids: '429724121147'
          role-duration-seconds: 1800
      - name: Read configuration evidence without deploying V2 or assuming its role
        env:
          PPB_DEPLOY_DOCUMENT_VERSION_VALUE: ${{ vars.PPB_DEPLOY_DOCUMENT_VERSION }}
          PPB_DEPLOY_DOCUMENT_SHA256_VALUE: ${{ vars.PPB_DEPLOY_DOCUMENT_SHA256 }}
          PPB_AUTO_DEPLOY_VALUE: ${{ vars.PPB_AUTO_DEPLOY }}
          PPB_SUBSCRIPTION_RUNNER_READY_VALUE: ${{ vars.PPB_SUBSCRIPTION_RUNNER_READY }}
          PPB_PUBLISH_TOKEN_PRESENT: ${{ secrets.CODEX_GITHUB_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/wp-test/audit-v2-capabilities.py
      - name: Invoke reviewed installed operation only if document matches
        env:
          OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'read' }}
        run: python3 ops/wp-test/parameterized/client.py "$OPERATION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parameterized-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: wp-result/
          retention-days: 7
