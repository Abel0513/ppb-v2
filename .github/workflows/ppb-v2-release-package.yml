name: PPB V2 build, private S3 package and optional controlled delivery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Package only (default), audit EC2, or deploy to EC2'
        required: true
        type: choice
        default: package_only
        options:
          - package_only
          - audit
          - deploy
      confirmation:
        description: 'For deploy only, enter DEPLOY-PPB-V2 (exact). Otherwise leave blank.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ppb-v2-private-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main' && github.repository == 'Abel0513/ppb-v2' && github.repository_id == '1454285732' && github.repository_owner_id == '55256582'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_PAGER: ''
      PPB_BUCKET: ppb-v2-release-artifacts-429724121147-use1
    steps:
      - name: Verify manual production approval before running any build
        shell: bash
        env:
          PPB_OPERATION: ${{ inputs.operation }}
          PPB_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$PPB_OPERATION:$PPB_CONFIRMATION" in
            package_only:|audit:|deploy:DEPLOY-PPB-V2) ;;
            *) echo "::error::Invalid operation or missing explicit deployment confirmation"; exit 1 ;;
          esac
          echo "Requested operation: $PPB_OPERATION"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies compatible with existing live Laravel provider cache
        run: |
          set -euo pipefail
          # Temporary compatibility mode: live V2 has require-dev providers
          # (laravel/pail) in bootstrap/cache/packages.php and services.php.
          # Do NOT silently replace its autoloader with a --no-dev one.
          # A future production-only transition must also transactionally
          # rebuild/roll back Laravel provider caches under separate approval.
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins --optimize-autoloader
          composer check-platform-reqs
          php -r 'require "vendor/autoload.php"; if (!class_exists("Laravel\\Pail\\PailServiceProvider")) { fwrite(STDERR,"STOP=PAIL_PROVIDER_NOT_LOADABLE\\n"); exit(1); } echo "AUTOLOAD_AND_PAIL=PASS\\n";'
      - name: Run all offline guard tests
        run: |
          set -euo pipefail
          bash -n ops/deploy/check-live.sh
          python3 -m unittest discover -s ops/deploy/tests -p 'test_*.py' -v
      - name: Create and check version archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/ppb-v2-$GITHUB_SHA.tar.gz"
          python3 ops/deploy/build-release.py --root "$GITHUB_WORKSPACE" --output "$archive"
          python3 ops/deploy/check-release.py "$archive"
          sha256_hex="$(sha256sum "$archive" | awk '{print $1}')"
          printf 'RELEASE_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
          printf 'RELEASE_SHA256=%s\n' "$sha256_hex" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::429724121147:role/PPB-V2-GitHub-Deploy-Role
          aws-region: us-east-1
          allowed-account-ids: '429724121147'
      - name: Upload immutable version to private S3 before optional SSM operation
        shell: bash
        env:
          AWS_REGION: us-east-1
        run: |
          set -euo pipefail
          key="releases/$GITHUB_SHA/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT.tar.gz"
          checksum_b64="$(python3 - "$RELEASE_ARCHIVE" <<'PY'
          import base64, hashlib, sys
          digest = hashlib.sha256()
          with open(sys.argv[1], 'rb') as fp:
              for block in iter(lambda: fp.read(1048576), b''):
                  digest.update(block)
          print(base64.b64encode(digest.digest()).decode())
          PY
          )"
          aws s3api put-object \
            --region "$AWS_REGION" \
            --bucket "$PPB_BUCKET" \
            --key "$key" \
            --body "$RELEASE_ARCHIVE" \
            --if-none-match '*' \
            --checksum-algorithm SHA256 \
            --checksum-sha256 "$checksum_b64" \
            --server-side-encryption AES256 \
            --metadata "git-commit=$GITHUB_SHA,sha256=$RELEASE_SHA256" \
            --query '{VersionId:VersionId,ChecksumSHA256:ChecksumSHA256}' \
            --output json
          {
            echo '## PPB V2 private release stored'
            printf -- '- Git commit: %s\n' "$GITHUB_SHA"
            printf -- '- S3 key: %s\n' "$key"
            printf -- '- SHA256: %s\n' "$RELEASE_SHA256"
            echo '- Packaging did not access the production host or DB; any later SSM operation is reported separately.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'RESULT=PPB_V2_PRIVATE_RELEASE_UPLOAD_PASS'

      - name: Audit or deploy pinned version through fixed SSM document
        if: ${{ inputs.operation == 'audit' || inputs.operation == 'deploy' }}
        shell: bash
        env:
          AWS_REGION: us-east-1
          PPB_INSTANCE_ID: i-0135d6b2fac7a54c2
          PPB_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          approval=NONE
          if [[ "$PPB_OPERATION" == deploy ]]; then approval=DEPLOY-PPB-V2; fi
          parameters="$(jq -nc \
            --arg commit "$GITHUB_SHA" \
            --arg sha "$RELEASE_SHA256" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg op "$PPB_OPERATION" \
            --arg approval "$approval" \
            '{Commit:[$commit],Sha256:[$sha],RunId:[$run_id],RunAttempt:[$attempt],Operation:[$op],Approval:[$approval]}')"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name PPB-V2-Controlled-Deploy \
            --instance-ids "$PPB_INSTANCE_ID" \
            --parameters "$parameters" \
            --timeout-seconds 1800 \
            --max-concurrency 1 \
            --max-errors 0 \
            --comment "ppb-v2 $PPB_OPERATION git=$GITHUB_SHA run=$GITHUB_RUN_ID" \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id"
          # Multi-step SSM documents require --plugin-name to fetch actual output.
          # Poll the final fixed step, not the document-level (Output=null) response.
          status=Pending
          for poll in $(seq 1 195); do
            status="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$PPB_INSTANCE_ID" \
              --plugin-name controlledRelease \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling|DeliveryTimedOut|ExecutionTimedOut) break ;;
            esac
            sleep 10
          done
          invocation="$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$PPB_INSTANCE_ID" \
            --plugin-name controlledRelease \
            --output json)"
          status="$(jq -r .Status <<<"$invocation")"
          code="$(jq -r .ResponseCode <<<"$invocation")"
          step_output="$(jq -r '.StandardOutputContent // ""' <<<"$invocation")"
          step_error="$(jq -r '.StandardErrorContent // ""' <<<"$invocation")"
          echo "SSM final step: controlledRelease; status=$status; response_code=$code"
          if [[ -n "$step_output" ]]; then printf '%s\n' "$step_output"; fi
          if [[ -n "$step_error" ]]; then printf '%s\n' "$step_error" >&2; fi
          {
            echo '## PPB V2 controlled AWS delivery'
            printf -- '- Operation: %s\n' "$PPB_OPERATION"
            printf -- '- Git commit: %s\n' "$GITHUB_SHA"
            printf -- '- Archive SHA256: %s\n' "$RELEASE_SHA256"
            printf -- '- SSM Command ID: %s\n' "$command_id"
            printf -- '- SSM final step: %s (exit %s)\n' "$status" "$code"
            echo '### Verified execution output'
            echo '```text'
            printf '%s\n' "$step_output" | grep -E '^(PHP_LINT_PASSED|COMMIT|RELEASE_FILES|REPLACE_FILES|ADD_FILES|DELETE_FILES|PRESERVED|DATABASE_MIGRATIONS_EXECUTED|LIVE_APPLICATION_DEPLOYED|RESULT)=' || true
            echo '```'
            echo '- No database migrations are run by this workflow. Application health requires separate functional validation.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" != Success || "$code" != 0 ]]; then
            echo "::error::SSM controlledRelease step failed: command=$command_id status=$status code=$code"
            exit 1
          fi
          expected_marker=RESULT=PPB_V2_CONTROLLED_AUDIT_PASS
          if [[ "$PPB_OPERATION" == deploy ]]; then
            expected_marker=RESULT=PPB_V2_CONTROLLED_DEPLOY_PASS
            if ! grep -Fxq "LIVE_APPLICATION_DEPLOYED=YES" <<<"$step_output"; then
              echo "::error::SSM returned success without live deployment confirmation"
              exit 1
            fi
          fi
          if ! grep -Fxq "$expected_marker" <<<"$step_output" || \
             ! grep -Fxq "DATABASE_MIGRATIONS_EXECUTED=NO" <<<"$step_output" || \
             ! grep -Fxq "COMMIT=$GITHUB_SHA" <<<"$step_output"; then
            echo "::error::SSM response is missing expected result/commit/no-migration markers"
            exit 1
          fi
          echo "RESULT=PPB_V2_SSM_${PPB_OPERATION^^}_PASS"
