name: PPB V2 build, private S3 package and optional controlled delivery

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Package only (default), audit EC2, or deploy to EC2'
        required: true
        type: choice
        default: package_only
        options:
          - package_only
          - audit
          - deploy
      source_pr:
        description: 'Trusted automatic dispatch source PR; blank for explicit operator release'
        required: false
        type: string
      expected_commit:
        description: 'Exact merged commit for automatic dispatch'
        required: false
        type: string
      confirmation:
        description: 'For deploy only, enter DEPLOY-PPB-V2 (exact). Otherwise leave blank.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ppb-v2-private-release
  cancel-in-progress: false

jobs:
  merge-gate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && vars.PPB_AUTO_DEPLOY != 'false')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/automation/release-gate.py
  package:
    needs: merge-gate
    if: always() && needs.merge-gate.outputs.approved == 'true' && github.ref == 'refs/heads/main' && github.repository == 'Abel0513/ppb-v2' && github.repository_id == '1454285732' && github.repository_owner_id == '55256582'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_PAGER: ''
      PPB_BUCKET: ppb-v2-release-artifacts-429724121147-use1
    steps:
      - name: Verify manual production approval before running any build
        shell: bash
        env:
          PPB_OPERATION: ${{ github.event_name == 'pull_request' && 'deploy' || inputs.operation }}
          PPB_CONFIRMATION: ${{ github.event_name == 'pull_request' && 'DEPLOY-PPB-V2' || inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$PPB_OPERATION:$PPB_CONFIRMATION" in
            package_only:|audit:|deploy:DEPLOY-PPB-V2) ;;
            *) echo "::error::Invalid operation or missing explicit deployment confirmation"; exit 1 ;;
          esac
          echo "Requested operation: $PPB_OPERATION"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies compatible with existing live Laravel provider cache
        run: |
          set -euo pipefail
          # Temporary compatibility mode: live V2 has require-dev providers
          # (laravel/pail) in bootstrap/cache/packages.php and services.php.
          # Do NOT silently replace its autoloader with a --no-dev one.
          # A future production-only transition must also transactionally
          # rebuild/roll back Laravel provider caches under separate approval.
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins --optimize-autoloader
          composer check-platform-reqs
          php -r 'require "vendor/autoload.php"; if (!class_exists("Laravel\\Pail\\PailServiceProvider")) { fwrite(STDERR,"STOP=PAIL_PROVIDER_NOT_LOADABLE\\n"); exit(1); } echo "AUTOLOAD_AND_PAIL=PASS\\n";'
      - name: Run all offline guard tests
        run: |
          set -euo pipefail
          bash -n ops/deploy/check-live.sh
          python3 -m unittest discover -s ops/deploy/tests -p 'test_*.py' -v
      - name: Create and check version archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          archive="$RUNNER_TEMP/ppb-v2-$GITHUB_SHA.tar.gz"
          python3 ops/deploy/build-release.py --root "$GITHUB_WORKSPACE" --output "$archive"
          python3 ops/deploy/check-release.py "$archive"
          sha256_hex="$(sha256sum "$archive" | awk '{print $1}')"
          printf 'RELEASE_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
          printf 'RELEASE_SHA256=%s\n' "$sha256_hex" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::429724121147:role/PPB-V2-GitHub-Deploy-Role
          aws-region: us-east-1
          allowed-account-ids: '429724121147'
      - name: Validate installed isolation, upload pinned release and collect actual EC2 result
        if: ${{ github.event_name == 'pull_request' || inputs.operation == 'audit' || inputs.operation == 'deploy' }}
        env:
          PPB_OPERATION: ${{ github.event_name == 'pull_request' && 'deploy' || inputs.operation }}
        run: python3 ops/deploy/release-client.py
      - name: Preserve bounded release result (no SQL dumps or raw credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: v2-result/
          if-no-files-found: ignore
          retention-days: 14

  acceptance-report:
    needs: [merge-gate, package]
    if: always() && github.event_name == 'pull_request' && needs.merge-gate.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_RESULT: ${{ needs.package.result }}
        with:
          script: |
            await github.rest.issues.createComment({...context.repo,issue_number:context.payload.pull_request.number,body:`V2 release/acceptance job: ${process.env.RELEASE_RESULT}. Actual SSM IDs, commit, backup/deploy evidence and functional baseline are in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. WP/DB/LIFF business acceptance is not implied. Failure requires inspection of the recorded transaction; no automatic retry or DB rollback.`});
